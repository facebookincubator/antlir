# Definitions of third-party Rust libraries used by the OSS build.
# The `rust/BUCK` file is generated from this manifest by reindeer
# and is NOT committed; CI regenerates it (see .github/workflows/ci.yml).
#
# The direct dependency set covers everything targets in this repo
# need, plus crates shared with the fbcode build of antlir, so the
# generated graph stays a superset of what either consumer resolves.

[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "top"
path = "top/main.rs"
test = false

