# twox-hash 2.1 depends on rand `>=0.9, <=0.11`; reindeer's auto-narrowing
# picks the (nonexistent) 0.11 lane, so pin the rand selected for the rest of
# the graph. The 2.0 lane (pulled in by ruzstd) still uses rand 0.8.
[resolver.dependencies.rand]
narrow_to = "=0.10.2"

['cfg(version = "=2.0.0")'.resolver.dependencies]
rand.narrow_to = "=0.8.8"
