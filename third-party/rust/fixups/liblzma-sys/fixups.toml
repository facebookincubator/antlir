include_paths = [
    ".",
    "xz/src/common",
    "xz/src/liblzma/api",
    "xz/src/liblzma/common",
    "xz/src/liblzma/lzma",
    "xz/src/liblzma/lz",
    "xz/src/liblzma/check",
    "xz/src/liblzma/delta",
    "xz/src/liblzma/rangecoder",
    "xz/src/liblzma/simple",
]
compiler_flags = ["-std=c99", "-DHAVE_CONFIG_H=1", "-DNDEBUG"]
