# quick-xml 0.42 depends on an unbounded `serde >=1.0.180` range, which
# reindeer's deterministic resolver refuses to resolve on its own. Pin it to
# the serde selected for the rest of the graph.
[resolver.dependencies.serde]
narrow_to = "=1.0.229"
