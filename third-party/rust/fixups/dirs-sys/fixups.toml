# dirs-sys 0.5 depends on an unbounded `windows-sys >=0.59` range, which
# reindeer's deterministic resolver refuses to resolve on its own. Pin it to
# the windows-sys selected for the rest of the graph.
[resolver.dependencies.windows-sys]
narrow_to = "=0.61.2"
