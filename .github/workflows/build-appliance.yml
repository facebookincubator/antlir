name: build-appliance

# Build the antlir2 bootstrap build appliance as a `.tar.zst` containing
# exactly the contents of a root filesystem (no wrapping directory).
#
# The rootfs is created from scratch with `debootstrap` running directly on
# the GitHub-hosted runner. A future self-hosting mode (rebuilding the
# appliance with antlir using the previous appliance, as in prod's
# fbcode//antlir/antlir2/facebook/images/build_appliance/defs.bzl `impl()`)
# can be added once there is a previous appliance and a way to test it.
#
# Adding a variant: add one row to the `include:` matrix below (variant name,
# debootstrap suite, mirror, arch, runner matching that arch).
# Everything else is variant-agnostic.

on:
  workflow_dispatch:
  release:
    # Build on release creation and attach the tarball to that same release.
    types: [published]
  push:
    branches:
      - "**"
    # Run on any branch push that touches this workflow itself, so changes
    # to the workflow are exercised by the workflow. (A `paths:` filter in
    # the same `push:` block would also gate tag pushes, so there is no
    # separate tag trigger here -- publishing a release builds via the
    # `release` trigger above.)
    paths:
      - ".github/workflows/build-appliance.yml"

permissions:
  contents: write # attach assets to the triggering release

env:
  # Package set from
  # fbcode//antlir/antlir2/package_managers/apt/build_appliance:features
  # (feature.apt_install), shared by every variant.
  APPLIANCE_PACKAGES: "apt,base-files,dpkg,mount,python3,python3-apt"
  # Directories from fbcode//antlir/antlir2/build_appliance:features :
  #   feature.ensure_dirs_exist(dirs = "/__antlir2__")
  #   feature.ensure_subdirs_exist(into_dir = "/__antlir2__",
  #       subdirs_to_create = "root" | "build_appliance" |
  #                           "working_directory" | "out")
  APPLIANCE_DIRS: "__antlir2__ __antlir2__/root __antlir2__/build_appliance __antlir2__/working_directory __antlir2__/out"

jobs:
  build:
    name: build-appliance (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian-trixie
            suite: trixie
            mirror: http://deb.debian.org/debian
            arch: amd64
            runner: ubuntu-26.04
          - variant: debian-trixie
            suite: trixie
            mirror: http://deb.debian.org/debian
            arch: arm64
            runner: ubuntu-26.04-arm
          - variant: ubuntu-noble
            suite: noble
            mirror: http://archive.ubuntu.com/ubuntu
            arch: amd64
            runner: ubuntu-26.04
          - variant: ubuntu-stonking
            suite: stonking
            mirror: http://archive.ubuntu.com/ubuntu
            arch: amd64
            runner: ubuntu-26.04
          - variant: ubuntu-stonking
            suite: stonking
            mirror: http://archive.ubuntu.com/ubuntu
            arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute names
        id: meta
        run: |
          set -euo pipefail
          name="build-appliance-${{ matrix.variant }}-${{ matrix.arch }}"
          echo "artifact_name=${name}" >> "$GITHUB_OUTPUT"
          echo "tarball=${name}.tar.zst" >> "$GITHUB_OUTPUT"
          echo "rootfs=${{ github.workspace }}/rootfs" >> "$GITHUB_OUTPUT"

      - name: Install host build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring ubuntu-keyring zstd

      - name: Bootstrap rootfs with debootstrap
        env:
          ROOTFS: ${{ steps.meta.outputs.rootfs }}
        run: |
          set -euo pipefail
          sudo debootstrap \
            --arch="${{ matrix.arch }}" \
            --variant=minbase \
            --include="$APPLIANCE_PACKAGES" \
            "${{ matrix.suite }}" "$ROOTFS" "${{ matrix.mirror }}"

      - name: Ensure appliance directories exist
        env:
          ROOTFS: ${{ steps.meta.outputs.rootfs }}
        run: |
          set -euo pipefail
          for d in $APPLIANCE_DIRS; do
            sudo mkdir -p "$ROOTFS/$d"
          done

      - name: Verify appliance contents
        env:
          ROOTFS: ${{ steps.meta.outputs.rootfs }}
        run: |
          set -euo pipefail
          for d in $APPLIANCE_DIRS; do
            test -d "$ROOTFS/$d" || { echo "::error::missing dir /$d"; exit 1; }
          done
          for pkg in ${APPLIANCE_PACKAGES//,/ }; do
            sudo chroot "$ROOTFS" /usr/bin/dpkg -s "$pkg" >/dev/null \
              || { echo "::error::package not installed: $pkg"; exit 1; }
          done
          sudo chroot "$ROOTFS" /usr/bin/python3 -c "import apt; print('python3-apt OK')"
          test -x "$ROOTFS/usr/bin/apt-get"
          test -x "$ROOTFS/bin/mount" || test -x "$ROOTFS/usr/bin/mount"

      - name: Pack rootfs contents as .tar.zst
        env:
          ROOTFS: ${{ steps.meta.outputs.rootfs }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -euo pipefail
          # Archive the *contents* of the rootfs (`./`), not the directory
          # itself, so consumers can extract it straight into a root dir.
          sudo tar -C "$ROOTFS" \
            --numeric-owner --xattrs --acls \
            --exclude "dev" \
            -I 'zstd -T0 -19' \
            -cf "${{ github.workspace }}/$TARBALL" .
          ls -lh "${{ github.workspace }}/$TARBALL"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.meta.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach tarball to the triggering release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.tarball }}
          fail_on_unmatched_files: true
