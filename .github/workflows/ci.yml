name: Tests
on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  buck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: facebook/install-dotslash@latest
      - name: Set apt cache date
        id: apt-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore apt package downloads
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ steps.apt-cache-date.outputs.date }}
          restore-keys: |
            apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}-
            apt-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y btrfs-progs clang libbz2-1.0 libcap-dev libclang-dev libffi8 liblzma5 pkg-config uidmap zlib1g
      - name: Save apt package downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Test target graph
        # GitHub runners have no Watchman; use the filesystem crawler instead
        # of the watchman file watcher from .buckconfig (--config does not
        # reach daemon startup, so append the override to .buckconfig).
        run: |
          printf '\n[buck2]\nfile_watcher = fs_hash_crawler\n' >> .buckconfig
          ./buck2 bxl //ci:test_target_graph.bxl:test_target_graph -- --eval_only true
      - name: Set up working volume
        run: |
          truncate -s 8G "$RUNNER_TEMP/antlir2-out.btrfs"
          sudo mkfs.btrfs -f "$RUNNER_TEMP/antlir2-out.btrfs"
          mkdir -p antlir2-out
          sudo mount -o loop,user_subvol_rm_allowed "$RUNNER_TEMP/antlir2-out.btrfs" antlir2-out
          sudo chown "$(id -u):$(id -g)" antlir2-out
          if ! grep -q "^$(id -un):" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$(id -un)"
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$(id -un)"
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test features
        # Buck-binary extraction needs an OSS runtime compatible with the image
        # libc. Keep its unit and layer-extraction tests covered in the meantime.
        run: |
          ./buck2 test --exclude disabled \
            //antlir/antlir2/features/apt/... \
            //antlir/antlir2/features/clone/... \
            //antlir/antlir2/features/dot_meta/... \
            //antlir/antlir2/features/ensure_dir_exists/... \
            //antlir/antlir2/features/extract: \
            //antlir/antlir2/features/extract/tests:binary-clone-fails \
            //antlir/antlir2/features/extract/tests:extract-layer-test \
            //antlir/antlir2/features/extract/tests:extract-sudo-test \
            //antlir/antlir2/features/extract/tests:extract-symlink-layer-test \
            //antlir/antlir2/features/extract/tests/dlopen:dlopen-notes-unittest \
            //antlir/antlir2/features/extract/tests/dlopen:extract-shutdown-test \
            //antlir/antlir2/features/genrule/... \
            //antlir/antlir2/features/group/... \
            //antlir/antlir2/features/hardlink/... \
            //antlir/antlir2/features/install/... \
            //antlir/antlir2/features/mount/... \
            //antlir/antlir2/features/oci/... \
            //antlir/antlir2/features/remove/... \
            //antlir/antlir2/features/requires/... \
            //antlir/antlir2/features/rpm: \
            //antlir/antlir2/features/symlink/... \
            //antlir/antlir2/features/tarball/... \
            //antlir/antlir2/features/user/... \
            //antlir/antlir2/features/usermod/... \
            //antlir/antlir2/features/test_only_features/build_environment/... \
            //antlir/antlir2/features/test_only_features/extend_facts/... \
            //antlir/antlir2/features/test_only_features/supplements/... \
            //antlir/antlir2/features/test_only_features/trace/...
