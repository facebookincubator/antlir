name: Tests
on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

jobs:
  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: facebook/install-dotslash@latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Generate Rust third-party targets
        # third-party/rust/BUCK is @generated by reindeer and not committed.
        # Regenerate it from the committed Cargo manifest + lockfile + fixups.
        run: |
          cargo install --locked --git https://github.com/facebookincubator/reindeer reindeer
          reindeer --third-party-dir third-party/rust buckify
      - name: Test target graph
        # GitHub runners have no Watchman; use the filesystem crawler instead
        # of the watchman file watcher from .buckconfig (--config does not
        # reach daemon startup, so append the override to .buckconfig).
        run: |
          printf '\n[buck2]\nfile_watcher = fs_hash_crawler\n' >> .buckconfig
          ./buck2 bxl //ci:test_target_graph.bxl:test_target_graph -- --eval_only true
