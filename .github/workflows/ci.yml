name: Tests
on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

jobs:
  buck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: facebook/install-dotslash@latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Set apt cache date
        id: apt-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore apt package downloads
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ steps.apt-cache-date.outputs.date }}
          restore-keys: |
            apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}-
            apt-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install apt test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y btrfs-progs clang libcap-dev libclang-dev pkg-config uidmap
      - name: Save apt package downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Restore generated Rust targets
        id: rust-targets-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third-party/rust/BUCK
            third-party/rust/vendor
            third-party/rust/.cargo/config.toml
          key: rust-targets-${{ hashFiles('third-party/rust/Cargo.lock', 'third-party/rust/fixups/**', 'third-party/rust/reindeer.toml') }}
      - name: Resolve Reindeer revision
        if: steps.rust-targets-cache.outputs.cache-hit != 'true'
        id: reindeer-revision
        run: |
          revision="$(git ls-remote https://github.com/facebookincubator/reindeer HEAD | cut -f1)"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Restore Reindeer installation
        if: steps.rust-targets-cache.outputs.cache-hit != 'true'
        id: reindeer-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reindeer/bin/reindeer
          key: reindeer-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.reindeer-revision.outputs.revision }}
      - name: Install Reindeer
        if: steps.rust-targets-cache.outputs.cache-hit != 'true' && steps.reindeer-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/facebookincubator/reindeer \
            --rev '${{ steps.reindeer-revision.outputs.revision }}' \
            --root "$RUNNER_TEMP/reindeer" reindeer
      - name: Save Reindeer installation
        if: steps.rust-targets-cache.outputs.cache-hit != 'true' && steps.reindeer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reindeer/bin/reindeer
          key: ${{ steps.reindeer-cache.outputs.cache-primary-key }}
      - name: Generate Rust third-party targets
        if: steps.rust-targets-cache.outputs.cache-hit != 'true'
        # third-party/rust/BUCK is @generated by reindeer and not committed.
        # Cache the vendored sources and per-crate BUCK files along with it.
        run: |
          "$RUNNER_TEMP/reindeer/bin/reindeer" --third-party-dir third-party/rust vendor --locked
          "$RUNNER_TEMP/reindeer/bin/reindeer" --third-party-dir third-party/rust buckify
      - name: Save generated Rust targets
        if: steps.rust-targets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third-party/rust/BUCK
            third-party/rust/vendor
            third-party/rust/.cargo/config.toml
          key: ${{ steps.rust-targets-cache.outputs.cache-primary-key }}
      - name: Test target graph
        # GitHub runners have no Watchman; use the filesystem crawler instead
        # of the watchman file watcher from .buckconfig (--config does not
        # reach daemon startup, so append the override to .buckconfig).
        run: |
          printf '\n[buck2]\nfile_watcher = fs_hash_crawler\n' >> .buckconfig
          ./buck2 bxl //ci:test_target_graph.bxl:test_target_graph -- --eval_only true
      - name: Set up apt test working volume
        run: |
          truncate -s 8G "$RUNNER_TEMP/antlir2-out.btrfs"
          sudo mkfs.btrfs -f "$RUNNER_TEMP/antlir2-out.btrfs"
          mkdir -p antlir2-out
          sudo mount -o loop,user_subvol_rm_allowed "$RUNNER_TEMP/antlir2-out.btrfs" antlir2-out
          sudo chown "$(id -u):$(id -g)" antlir2-out
          if ! grep -q "^$(id -un):" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$(id -un)"
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$(id -un)"
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test apt features
        run: |
          ./buck2 test //antlir/antlir2/features/apt/tests:
